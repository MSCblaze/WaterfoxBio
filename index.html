<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfox Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-nebula nebula-1"></div>
    <div class="bg-nebula nebula-2"></div>
    <div class="bg-nebula nebula-3"></div>

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">
    <input type="checkbox" id="zoom-toggle">

    <div class="click-zones">
        <div class="zone-left">
            <label for="slide3" class="to-s3"></label>
            <label for="slide1" class="to-s1"></label>
            <label for="slide2" class="to-s2"></label>
        </div>
        <div class="zone-right">
            <label for="slide2" class="to-s2"></label>
            <label for="slide3" class="to-s3"></label>
            <label for="slide1" class="to-s1"></label>
        </div>
    </div>

    <main>
        <div class="header-container">
            <h1 class="main-title t1">Monochrome Mountains</h1>
            <h1 class="main-title t2 silver-mode">Soon...</h1>
            <h1 class="main-title t3 silver-mode">Soon...</h1>
        </div>

        <div class="carousel-container">
            <div class="carousel-track">
                <div class="card c1">
                    <label for="zoom-toggle" class="zoom-trigger">
                        <img src="assets/one.webp" alt="">
                    </label>
                </div>
                <div class="card c2 fallback">
                    <div class="fallback-text">Soon...</div>
                </div>
                <div class="card c3 fallback">
                    <div class="fallback-text">Soon...</div>
                </div>
            </div>
            <div class="nav-visual btn-prev">←</div>
            <div class="nav-visual btn-next">→</div>
        </div>

        <section class="instructions-section">
            <h2 class="section-title">УСТАНОВКА ТЕМЫ</h2>
            <div class="monolith-card">
                <p class="monolith-text">Полный гайд и файлы кастомизации выдаются сразу по завершении работы над вашей индивидуальной сборкой. Вы получите закрытый архив и простую пошаговую инструкцию по установке.</p>
            </div>
        </section>

        <div class="lightbox">
            <label for="zoom-toggle" class="close-overlay"></label>
            <div class="lightbox-content">
                <label for="zoom-toggle" class="close-btn">×</label>
                <img src="assets/one.webp" alt="">
            </div>
        </div>
    </main>

</body>
</html>
