<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfox Themes Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Waterfox Studio</div>
        <button id="theme-toggle">Переключить тему</button>
    </header>

    <main>
        <section class="hero">
            <h1>Кастомные темы для Waterfox</h1>
            <p>Уникальный дизайн, плавные анимации и серебряный стиль</p>
        </section>

        <section class="roulette-section">
            <h2>Витрина тем</h2>
            <div class="roulette-container">
                <button class="nav-btn prev" id="prevBtn">&lt;</button>
                <div class="track-wrapper">
                    <div class="track" id="track">
                        <div class="card" onclick="openModal('assets/one.webp')">
                            <img src="assets/one.webp" alt="Theme 1" onerror="this.remove(); this.parentNode.classList.add('empty');">
                            <div class="empty-text">Soon</div>
                            <div class="card-title">Тема #1</div>
                        </div>
                        <div class="card" onclick="openModal('assets/two.webp')">
                            <img src="assets/two.webp" alt="Theme 2" onerror="this.remove(); this.parentNode.classList.add('empty');">
                            <div class="empty-text">Soon</div>
                            <div class="card-title">Тема #2</div>
                        </div>
                        <div class="card" onclick="openModal('assets/three.webp')">
                            <img src="assets/three.webp" alt="Theme 3" onerror="this.remove(); this.parentNode.classList.add('empty');">
                            <div class="empty-text">Soon</div>
                            <div class="card-title">Тема #3</div>
                        </div>
                        <div class="card" onclick="openModal('assets/four.webp')">
                            <img src="assets/four.webp" alt="Theme 4" onerror="this.remove(); this.parentNode.classList.add('empty');">
                            <div class="empty-text">Soon</div>
                            <div class="card-title">Тема #4</div>
                        </div>
                    </div>
                </div>
                <button class="nav-btn next" id="nextBtn">&gt;</button>
            </div>
        </section>
    </main>

    <div class="modal" id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="Preview">
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
        });

        const track = document.getElementById('track');
        let index = 0;

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (index < 3) index++;
            else index = 0;
            updateSlider();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (index > 0) index--;
            else index = 3;
            updateSlider();
        });

        function updateSlider() {
            track.style.transform = `translateX(-${index * 300}px)`;
        }

        function openModal(src) {
            const card = event.currentTarget;
            if (card.classList.contains('empty')) return;
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
    </script>
</body>
</html>
