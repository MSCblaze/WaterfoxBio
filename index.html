<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfox Custom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow"></div>

    <div class="wrapper">
        <input type="radio" name="gallery" id="tab1" checked>
        <input type="radio" name="gallery" id="tab2">
        <input type="radio" name="gallery" id="tab3">

        <input type="checkbox" id="zoom-toggle">

        <div class="titles-container">
            <h1 class="title t1">Monochrome Mountains</h1>
            <h1 class="title t2">Soon...</h1>
            <h1 class="title t3">Soon...</h1>
        </div>

        <div class="main-stage">
            <div class="carousel">
                <div class="card c1">
                    <label for="zoom-toggle" class="zoom-trigger">
                        <img src="assets/one.webp" alt="">
                    </label>
                </div>
                <div class="card c2">
                    <span>Soon...</span>
                </div>
                <div class="card c3">
                    <span>Soon...</span>
                </div>
            </div>

            <div class="nav-arrows">
                <div class="arrow-box prev-box">
                    <label for="tab3" class="to-t3">←</label>
                    <label for="tab1" class="to-t1">←</label>
                    <label for="tab2" class="to-t2">←</label>
                </div>
                <div class="arrow-box next-box">
                    <label for="tab2" class="to-t2">→</label>
                    <label for="tab3" class="to-t3">→</label>
                    <label for="tab1" class="to-t1">→</label>
                </div>
            </div>
        </div>

        <div class="info-section">
            <h2>УСТАНОВКА ТЕМЫ</h2>
            <div class="info-box">
                <p>Полный гайд и файлы кастомизации выдаются сразу по завершении работы над вашей индивидуальной сборкой. Вы получите закрытый архив и простую пошаговую инструкцию по установке.</p>
            </div>
        </div>

        <div class="lightbox">
            <label for="zoom-toggle" class="close-overlay"></label>
            <div class="lightbox-content">
                <label for="zoom-toggle" class="close-btn">×</label>
                <img src="assets/one.webp" alt="">
            </div>
        </div>
    </div>

</body>
</html>
