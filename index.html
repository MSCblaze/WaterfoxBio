<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waterfox Studio — Темы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

    <header>
        <div class="logo">Waterfox <span>Studio</span></div>
        <button id="theme-toggle" class="btn-theme">Сменить тему</button>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Кастомные темы для Waterfox</h1>
            <p>Уникальный интерфейс, неоновая эстетика и детализация</p>
        </section>

        <section class="roulette-section">
            <h2>Витрина работ</h2>
            <div class="carousel">
                <button class="nav-btn prev" id="prevBtn">&larr;</button>

                <div class="track-wrapper">
                    <div class="track" id="track">
                        
                        <div class="card" data-src="assets/one.webp">
                            <div class="img-wrapper">
                                <img src="assets/one.webp" alt="Тема 1">
                                <span class="soon-text">SOON</span>
                            </div>
                            <div class="card-info">
                                <span class="card-title">Тема #1</span>
                            </div>
                        </div>

                        <div class="card" data-src="assets/two.webp">
                            <div class="img-wrapper">
                                <img src="assets/two.webp" alt="Тема 2">
                                <span class="soon-text">SOON</span>
                            </div>
                            <div class="card-info">
                                <span class="card-title">Тема #2</span>
                            </div>
                        </div>

                        <div class="card" data-src="assets/three.webp">
                            <div class="img-wrapper">
                                <img src="assets/three.webp" alt="Тема 3">
                                <span class="soon-text">SOON</span>
                            </div>
                            <div class="card-info">
                                <span class="card-title">Тема #3</span>
                            </div>
                        </div>

                        <div class="card" data-src="assets/four.webp">
                            <div class="img-wrapper">
                                <img src="assets/four.webp" alt="Тема 4">
                                <span class="soon-text">SOON</span>
                            </div>
                            <div class="card-info">
                                <span class="card-title">Тема #4</span>
                            </div>
                        </div>

                        <div class="card" data-src="assets/five.webp">
                            <div class="img-wrapper">
                                <img src="assets/five.webp" alt="Тема 5">
                                <span class="soon-text">SOON</span>
                            </div>
                            <div class="card-info">
                                <span class="card-title">Тема #5</span>
                            </div>
                        </div>

                    </div>
                </div>

                <button class="nav-btn next" id="nextBtn">&rarr;</button>
            </div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img id="modal-img" src="" alt="Full Preview">
        </div>
    </div>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            const img = card.querySelector('img');
            const src = card.getAttribute('data-src');

            img.onerror = () => {
                card.classList.add('is-empty');
            };

            card.addEventListener('click', () => {
                if (!card.classList.contains('is-empty')) {
                    const modal = document.getElementById('modal');
                    const modalImg = document.getElementById('modal-img');
                    modalImg.src = src;
                    modal.classList.add('active');
                }
            });
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').classList.remove('active');
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').classList.remove('active');
            }
        });

        const track = document.getElementById('track');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;

        function getVisibleCards() {
            const wrapperWidth = document.querySelector('.track-wrapper').clientWidth;
            if (wrapperWidth < 600) return 1;
            if (wrapperWidth < 900) return 2;
            return 3;
        }

        function updateSlider() {
            const cards = document.querySelectorAll('.card');
            const cardWidth = cards[0].offsetWidth + 24;
            const maxIndex = cards.length - getVisibleCards();
            
            if (currentIndex > maxIndex) currentIndex = maxIndex;
            if (currentIndex < 0) currentIndex = 0;

            track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
        }

        nextBtn.addEventListener('click', () => {
            const cards = document.querySelectorAll('.card');
            const maxIndex = cards.length - getVisibleCards();
            if (currentIndex < maxIndex) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateSlider();
        });

        prevBtn.addEventListener('click', () => {
            const cards = document.querySelectorAll('.card');
            const maxIndex = cards.length - getVisibleCards();
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = maxIndex;
            }
            updateSlider();
        });

        window.addEventListener('resize', updateSlider);

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.body.classList.toggle('dark');
            document.body.classList.toggle('light');
        });
    </script>
</body>
</html>
