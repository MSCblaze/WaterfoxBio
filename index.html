<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="lightbox-toggle" class="lightbox-checkbox">
    <div class="lightbox-modal">
        <label for="lightbox-toggle" class="lightbox-overlay"></label>
        <div class="lightbox-content">
            <label for="lightbox-toggle" class="lightbox-close">&times;</label>
            <img src="" id="lightbox-img" alt="Fullscreen View">
        </div>
    </div>
    <div class="bg-nebula nebula-1"></div>
    <div class="bg-nebula nebula-2"></div>
    <main>
        <div class="header-container">
            <h1 class="main-title" id="themeTitle">Monochrome Mountains</h1>
        </div>
        <section class="carousel-container">
            <button class="nav-btn prev" id="prevBtn">&lt;</button>
            <div class="carousel-track-container">
                <div class="carousel-track" id="track">
                    <div class="card" data-title="Monochrome Mountains">
                        <label for="lightbox-toggle" class="lightbox-trigger">
                            <img src="assets/one.webp" alt="Monochrome Mountains" onerror="this.remove(); this.parentElement.parentElement.classList.add('fallback');">
                        </label>
                        <div class="fallback-text">Soon...</div>
                    </div>
                    <div class="card" data-title="Soon...">
                        <label for="lightbox-toggle" class="lightbox-trigger">
                            <img src="assets/two.webp" alt="Card 2" onerror="this.remove(); this.parentElement.parentElement.classList.add('fallback');">
                        </label>
                        <div class="fallback-text">Soon...</div>
                    </div>
                    <div class="card" data-title="Soon...">
                        <label for="lightbox-toggle" class="lightbox-trigger">
                            <img src="assets/three.webp" alt="Card 3" onerror="this.remove(); this.parentElement.parentElement.classList.add('fallback');">
                        </label>
                        <div class="fallback-text">Soon...</div>
                    </div>
                </div>
            </div>
            <button class="nav-btn next" id="nextBtn">&gt;</button>
        </section>
        <section class="instructions-section">
            <h2 class="section-title">УСТАНОВКА ТЕМЫ</h2>
            <div class="monolith-card">
                <p class="monolith-text">Полный гайд и файлы кастомизации выдаются сразу по завершении работы над вашей индивидуальной сборкой. Вы получите закрытый архив и простую пошаговую инструкцию по установке.</p>
            </div>
        </section>
    </main>
    <script>
        const track = document.getElementById('track');
        const cards = Array.from(track.children);
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const themeTitle = document.getElementById('themeTitle');
        const lightboxImg = document.getElementById('lightbox-img');
        let currentIndex = 0;
        function updateCarousel() {
            cards.forEach((card, index) => {
                card.classList.remove('active', 'left', 'right', 'hidden');
                let diff = index - currentIndex;
                if (diff === 0) {
                    card.classList.add('active');
                    const activeImg = card.querySelector('img');
                    if (activeImg) {
                        lightboxImg.src = activeImg.src;
                    }
                } else if (diff === -1 || (currentIndex === 0 && index === cards.length - 1)) {
                    card.classList.add('left');
                } else if (diff === 1 || (currentIndex === cards.length - 1 && index === 0)) {
                    card.classList.add('right');
                } else {
                    card.classList.add('hidden');
                }
            });
            themeTitle.style.opacity = '0';
            themeTitle.style.transform = 'translateY(-10px)';
            setTimeout(() => {
                const currentTitle = cards[currentIndex].getAttribute('data-title');
                themeTitle.textContent = currentTitle;
                if (currentTitle === 'Soon...') {
                    themeTitle.classList.add('silver-mode');
                } else {
                    themeTitle.classList.remove('silver-mode');
                }
                themeTitle.style.opacity = '1';
                themeTitle.style.transform = 'translateY(0)';
            }, 200);
        }
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % cards.length;
            updateCarousel();
        });
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateCarousel();
        });
        updateCarousel();
    </script>
</body>
</html>
